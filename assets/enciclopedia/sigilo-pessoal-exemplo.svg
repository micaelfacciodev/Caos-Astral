<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Exemplo ilustrativo genérico de um sigilo condensado — não corresponde
       a nenhuma frase de intenção real, só demonstra a estética do método. -->
  <g stroke="#000" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 40 160 L 90 40 L 130 130 L 170 50"/>
    <path d="M 60 90 L 150 90"/>
    <circle cx="90" cy="40" r="7" fill="#000" stroke="none"/>
    <circle cx="170" cy="50" r="7" fill="#000" stroke="none"/>
  </g>
</svg>
