name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 9 * * 0,3'   # domingo e quarta, 9h UTC
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para o commit anti-hibernação
  issues: write      # necessário para abrir Issue em caso de falha

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ============================================================
      # VERSÃO TEMPORÁRIA DE DEBUG (19/08) — as três chamadas abaixo
      # trocaram `curl -sf` (falha silenciosa, esconde a resposta de
      # erro) por uma checagem manual de status que IMPRIME o corpo
      # da resposta antes de falhar. É só pra achar a causa do exit
      # code 22 da run #1 — depois de resolvido, isso volta pro
      # `curl -sf` original, mais enxuto.
      # ============================================================

      - name: Ping Supabase (heartbeat table)
        id: read
        run: |
          STATUS=$(curl -s -o /tmp/resp_ping.json -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&order=id.desc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          echo "Corpo da resposta:"
          cat /tmp/resp_ping.json
          echo ""
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Ping (GET) falhou com status $STATUS"
            exit 1
          fi

      - name: Insert new heartbeat row
        id: insert
        run: |
          STATUS=$(curl -s -o /tmp/resp_insert.json -w "%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{}')
          echo "HTTP status: $STATUS"
          echo "Corpo da resposta:"
          cat /tmp/resp_insert.json
          echo ""
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Insert (POST) falhou com status $STATUS"
            exit 1
          fi

      - name: Delete heartbeat rows older than 7 days
        id: cleanup
        run: |
          CUTOFF=$(date -u -d '7 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          echo "Cutoff: $CUTOFF"
          STATUS=$(curl -s -o /tmp/resp_delete.json -w "%{http_code}" -X DELETE "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?created_at=lt.${CUTOFF}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Prefer: return=representation")
          echo "HTTP status: $STATUS"
          echo "Corpo da resposta:"
          cat /tmp/resp_delete.json
          echo ""
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Delete falhou com status $STATUS"
            exit 1
          fi
        # Nota: DELETE via anon/publishable key normalmente é bloqueado por RLS (o que é bom!).
        # Por isso essa etapa usa a secret key (antiga service_role), que ignora RLS.

      - name: Update last-run marker (keeps repo active)
        run: |
          mkdir -p .heartbeat
          echo "Last successful run: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > .heartbeat/last-run.txt
          git config user.name "heartbeat-bot"
          git config user.email "actions@github.com"
          git add .heartbeat/last-run.txt
          git diff --staged --quiet || git commit -m "chore: heartbeat run $(date -u +%Y-%m-%d)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Supabase Heartbeat falhou em ${new Date().toISOString().slice(0,10)}`,
              body: [
                'O workflow **Supabase Heartbeat** falhou.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Possíveis causas:',
                '- Chave da API (anon/publishable ou service_role/secret) expirada ou revogada',
                '- RLS bloqueando SELECT/INSERT/DELETE',
                '- Projeto Supabase já pausado (verifique o dashboard)',
                '- URL do projeto incorreta'
              ].join('\n'),
              labels: ['bug']
            });
