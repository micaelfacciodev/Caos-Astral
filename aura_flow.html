<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deriva</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body{
    margin:0; padding:0; background:#0a0908; overflow:hidden;
    height:100%; width:100%;
  }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .voltar-fallback{
    position:fixed; top:16px; left:16px; z-index:10;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    background:rgba(10,9,8,0.72); border:1px solid rgba(193,74,60,0.4);
    color:#d8b7a1; padding:10px 16px; cursor:pointer;
    text-decoration:none; display:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- só aparece se a página for aberta direto, fora do overlay da Deriva -->
<a class="voltar-fallback" id="voltarFallback" href="deriva">← voltar</a>

<script>
(function(){
  if (window.top === window) {
    document.getElementById('voltarFallback').style.display = 'block';
  }

  const params = new URLSearchParams(location.search);
  const layer = params.get('layer') || 'vortice';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dim = { w: 0, h: 0 };

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    dim.w = window.innerWidth;
    dim.h = window.innerHeight;
    canvas.width = Math.round(dim.w * dpr);
    canvas.height = Math.round(dim.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // pausa quando a aba não está visível, mesma lógica de economia da página principal
  let visible = true;
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

  // ================= VÓRTICE =================
  function runVortice(){
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');
    const OW = 110;
    let OH = 110, img;
    function resizeOff(){
      OH = Math.max(2, Math.round(OW * (dim.h / Math.max(dim.w, 1))));
      off.width = OW; off.height = OH;
      img = octx.createImageData(OW, OH);
    }
    resizeOff();
    window.addEventListener('resize', resizeOff);

    const ARMS = 3, PER_ARM = 7;
    const blobs = [];
    for (let a = 0; a < ARMS; a++) {
      for (let s = 0; s < PER_ARM; s++) {
        const f = s / (PER_ARM - 1);
        blobs.push({ arm: a, f, rr: 0.055 * (1 - f * 0.55) + 0.01 });
      }
    }

    let t = 0;
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        const data = img.data;
        const minDim = Math.min(OW, OH);
        let idx = 0;
        for (let y = 0; y < OH; y++) {
          const ny = (y / OH - 0.5) * (OH / minDim) * 2;
          for (let x = 0; x < OW; x++) {
            const nx = (x / OW - 0.5) * (OW / minDim) * 2;
            let field = 0;
            for (const b of blobs) {
              const theta = b.f * 5.4 + (b.arm / ARMS) * Math.PI * 2 - t * 0.55;
              const r = 0.66 * (1 - b.f) + 0.015;
              const bx = Math.cos(theta) * r, by = Math.sin(theta) * r;
              const r2 = b.rr * b.rr;
              field += r2 / ((nx - bx) ** 2 + (ny - by) ** 2 + 0.0006);
            }
            const edge = 1.3;
            const alpha = Math.max(0, Math.min(1, (field - edge) * 6.5));
            const shade = Math.min(1, field / (edge * 2.2));
            data[idx++] = Math.round(80 + shade * 150);
            data[idx++] = Math.round(4 + shade * 12);
            data[idx++] = Math.round(4 + shade * 12);
            data[idx++] = Math.round(alpha * 255);
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.fillStyle = 'rgba(10,9,8,0.28)';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(off, 0, 0, w, h);
        t += 0.012;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= CIMÁTICA =================
  function runCimatica(){
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');
    const OW = 140;
    let OH = 140, img;
    function resizeOff(){
      OH = Math.max(2, Math.round(OW * (dim.h / Math.max(dim.w, 1))));
      off.width = OW; off.height = OH;
      img = octx.createImageData(OW, OH);
    }
    resizeOff();
    window.addEventListener('resize', resizeOff);

    let t = 0;
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        const data = img.data;
        let idx = 0;
        const n = 4 + Math.sin(t * 0.1) * 2.5;
        const m = 6 + Math.cos(t * 0.075) * 3;
        for (let y = 0; y < OH; y++) {
          const ny = (y / OH) * Math.PI;
          for (let x = 0; x < OW; x++) {
            const nx = (x / OW) * Math.PI;
            const v = Math.sin(n * nx) * Math.sin(m * ny) - Math.sin(m * nx) * Math.sin(n * ny);
            const nodal = 1 - Math.min(1, Math.abs(v) * 3.4);
            const light = Math.round(nodal * nodal * 205);
            data[idx++] = Math.round(20 + light * 0.9);
            data[idx++] = Math.round(6 + light * 0.35);
            data[idx++] = Math.round(6 + light * 0.35);
            data[idx++] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(off, 0, 0, w, h);
        t += 0.017;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= FUMAÇA =================
  function runFumaca(){
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');
    const OW = 70;
    let OH = 100, img;
    function resizeOff(){
      OH = Math.max(2, Math.round(OW * (dim.h / Math.max(dim.w, 1))));
      off.width = OW; off.height = OH;
      img = octx.createImageData(OW, OH);
    }
    resizeOff();
    window.addEventListener('resize', resizeOff);

    let t = 0;
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        const data = img.data;
        let idx = 0;
        for (let y = 0; y < OH; y++) {
          const fy = y / OH;
          for (let x = 0; x < OW; x++) {
            const fx = x / OW;
            const v = Math.sin(fx * 7.5 + (fy * 9.5 - t * 1.05)) * 0.5 +
                      Math.sin(fx * 13.5 - (fy * 5.2 - t * 0.68) + 2.1) * 0.3 +
                      Math.sin((fx + fy) * 10.5 - t * 0.85) * 0.2;
            const norm = (v + 1) / 2;
            const density = norm * (1 - fy * 0.75);
            const light = Math.round(density * 190);
            data[idx++] = Math.round(60 + light * 0.7);
            data[idx++] = Math.round(30 + light * 0.55);
            data[idx++] = Math.round(30 + light * 0.5);
            data[idx++] = Math.round(density * 205);
          }
        }
        octx.putImageData(img, 0, 0);
        ctx.fillStyle = '#0a0908';
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(off, 0, 0, w, h);
        ctx.restore();
        t += 0.01;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= GEOMETRIA SAGRADA =================
  function runGeometria(){
    let t = 0;
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        ctx.fillStyle = 'rgba(10,9,8,0.2)';
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        const R = Math.min(w, h) * 0.16;
        const pulse = 1 + Math.sin(t * 0.45) * 0.05;
        const rot = t * 0.06;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = 1.2;

        const centers = [[0, 0]];
        for (let i = 0; i < 6; i++) {
          const a = rot + (i / 6) * Math.PI * 2;
          centers.push([Math.cos(a) * R * pulse, Math.sin(a) * R * pulse]);
        }
        for (let i = 0; i < 6; i++) {
          const a = rot + (i / 6) * Math.PI * 2 + Math.PI / 6;
          centers.push([Math.cos(a) * R * pulse * 1.73, Math.sin(a) * R * pulse * 1.73]);
        }
        for (let i = 0; i < 12; i++) {
          const a = rot - (i / 12) * Math.PI * 2;
          centers.push([Math.cos(a) * R * pulse * 2.6, Math.sin(a) * R * pulse * 2.6]);
        }

        for (const [x, y] of centers) {
          const alpha = 0.22 + 0.12 * Math.sin(t * 0.6 + x * 0.01 + y * 0.01);
          ctx.strokeStyle = `rgba(176,166,150,${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, R * pulse, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
        t += 0.012;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= CONSTELAÇÃO =================
  function runConstelacao(){
    const N = 46;
    const pts = Array.from({length: N}, () => ({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.00025,
      vy: (Math.random() - 0.5) * 0.00025,
      tw: Math.random() * Math.PI * 2
    }));
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        ctx.fillStyle = 'rgba(10,9,8,0.26)';
        ctx.fillRect(0, 0, w, h);

        for (const p of pts) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > 1) p.vx *= -1;
          if (p.y < 0 || p.y > 1) p.vy *= -1;
          p.tw += 0.018;
        }

        const thresh = Math.min(w, h) * 0.16;
        ctx.strokeStyle = 'rgba(193,74,60,0.35)';
        ctx.lineWidth = 0.8;
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const dx = (pts[i].x - pts[j].x) * w;
            const dy = (pts[i].y - pts[j].y) * h;
            const d = Math.hypot(dx, dy);
            if (d < thresh) {
              ctx.globalAlpha = 1 - d / thresh;
              ctx.beginPath();
              ctx.moveTo(pts[i].x * w, pts[i].y * h);
              ctx.lineTo(pts[j].x * w, pts[j].y * h);
              ctx.stroke();
            }
          }
        }
        ctx.globalAlpha = 1;

        for (const p of pts) {
          const s = 1 + Math.sin(p.tw) * 0.6;
          ctx.fillStyle = 'rgba(176,166,150,0.85)';
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, 1.6 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= OLHO =================
  function runOlho(){
    let t = 0;
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        ctx.fillStyle = '#0a0908';
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        const irisR = Math.min(w, h) * 0.3;
        const pupilR = irisR * (0.32 + 0.15 * Math.sin(t * 0.22));

        ctx.fillStyle = '#14100e';
        ctx.beginPath();
        ctx.ellipse(cx, cy, irisR * 1.65, irisR * 1.08, 0, 0, Math.PI * 2);
        ctx.fill();

        const grad = ctx.createRadialGradient(cx, cy, pupilR, cx, cy, irisR);
        grad.addColorStop(0, 'rgba(193,74,60,0.55)');
        grad.addColorStop(0.6, 'rgba(140,125,111,0.5)');
        grad.addColorStop(1, 'rgba(10,9,8,0.9)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, irisR, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.015);
        ctx.strokeStyle = 'rgba(176,166,150,0.22)';
        ctx.lineWidth = 1.2;
        const striae = 40;
        for (let i = 0; i < striae; i++) {
          const a = (i / striae) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * pupilR * 1.1, Math.sin(a) * pupilR * 1.1);
          ctx.lineTo(Math.cos(a) * irisR * 0.97, Math.sin(a) * irisR * 0.97);
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = '#050403';
        ctx.beginPath();
        ctx.arc(cx, cy, pupilR, 0, Math.PI * 2);
        ctx.fill();

        t += 0.013;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= BATIMENTO =================
  function runBatimento(){
    let t = 0;
    const history = [];
    function pulseValue(phase){
      const f = phase % 1;
      if (f > 0.46 && f < 0.58) {
        const k = (f - 0.46) / 0.12;
        return Math.sin(k * Math.PI) * (k < 0.5 ? 1 : -0.35) * 1.4;
      }
      if (f > 0.6 && f < 0.78) {
        return Math.sin(((f - 0.6) / 0.18) * Math.PI) * 0.18;
      }
      return 0;
    }
    function frame(){
      if (visible) {
        const w = dim.w, h = dim.h;
        ctx.fillStyle = 'rgba(10,9,8,0.3)';
        ctx.fillRect(0, 0, w, h);

        t += 0.014;
        history.push(pulseValue(t * 0.5));
        const maxPts = Math.max(40, Math.round(w / 1.4));
        while (history.length > maxPts) history.shift();

        ctx.strokeStyle = 'rgba(176,166,150,0.9)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        const midY = h * 0.5;
        for (let i = 0; i < history.length; i++) {
          const x = (i / (maxPts - 1)) * w;
          const y = midY - history[i] * h * 0.24;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        if (history.length) {
          const lastX = ((history.length - 1) / (maxPts - 1)) * w;
          const lastY = midY - history[history.length - 1] * h * 0.24;
          ctx.fillStyle = 'rgba(193,74,60,0.9)';
          ctx.beginPath();
          ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      requestAnimationFrame(frame);
    }
    frame();
  }


  // ================= ESTRELAS (portada de hyperspace_flow.html) =================
  function runStars(){
    let stars = [];
    const COUNT = 550;
    function md(){ return Math.max(dim.w, dim.h); }
    function colorFn(){
      return `rgba(${200 + Math.floor(Math.random()*55)},${10 + Math.floor(Math.random()*40)},${10 + Math.floor(Math.random()*30)},`;
    }
    function resetStar(s){
      const m = md();
      s.x = (Math.random()*2-1) * dim.w;
      s.y = (Math.random()*2-1) * dim.h;
      s.z = m * 1.2;
      s.prevZ = s.z;
      s.colorFn = colorFn();
    }
    function buildStars(){
      stars = [];
      const m = md();
      for (let i=0;i<COUNT;i++){
        const s = { x:(Math.random()*2-1)*dim.w, y:(Math.random()*2-1)*dim.h, z: Math.random()*m*1.2+1, prevZ:0, colorFn: colorFn() };
        s.prevZ = s.z;
        stars.push(s);
      }
    }
    buildStars();
    window.addEventListener('resize', buildStars);

    const speed = 3.0, direction = 1;
    function frame(){
      if (visible){
        const w = dim.w, h = dim.h, cx = w/2, cy = h/2;
        const sp = speed * (w/900);
        const focal = Math.min(w,h)*0.5;
        const m = md();
        ctx.fillStyle = 'rgba(10,9,8,0.35)';
        ctx.fillRect(0,0,w,h);
        for (const s of stars){
          s.prevZ = s.z;
          s.z -= sp * direction;
          if (s.z <= 1 || s.z > m*1.3){ resetStar(s); continue; }
          const k = focal/s.z;
          const px = cx + s.x*k, py = cy + s.y*k;
          const kPrev = focal/s.prevZ;
          const ppx = cx + s.x*kPrev, ppy = cy + s.y*kPrev;
          const proximity = 1 - Math.min(s.z/m, 1);
          const size = Math.max(0.4, proximity*3.2);
          const alpha = Math.min(1, 0.15 + proximity*1.1);
          ctx.strokeStyle = s.colorFn + alpha + ')';
          ctx.lineWidth = size;
          ctx.beginPath();
          ctx.moveTo(ppx,ppy);
          ctx.lineTo(px,py);
          ctx.stroke();
        }
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= WORMHOLE (portada de hyperspace_flow.html) =================
  function runWormhole(){
    let rings = [];
    const N = 40;
    function md(){ return Math.max(dim.w, dim.h); }
    function colorFn(){
      return `rgba(${200 + Math.floor(Math.random()*55)},${10 + Math.floor(Math.random()*40)},${10 + Math.floor(Math.random()*30)},`;
    }
    function resetRing(r){
      const m = md();
      r.z = m*1.3;
      r.seedPhase = Math.random()*Math.PI*2;
      r.h1 = 2+Math.floor(Math.random()*3);
      r.h2 = 4+Math.floor(Math.random()*4);
      r.rotSpeed = (Math.random()-0.5)*0.006;
      r.rot = Math.random()*Math.PI*2;
      r.colorFn = colorFn();
    }
    function buildRings(){
      rings = [];
      const m = md();
      for (let i=0;i<N;i++){
        rings.push({ z:(i/N)*m*1.3+1, seedPhase:Math.random()*Math.PI*2, h1:2+Math.floor(Math.random()*3), h2:4+Math.floor(Math.random()*4), rotSpeed:(Math.random()-0.5)*0.006, rot:Math.random()*Math.PI*2, colorFn: colorFn() });
      }
    }
    buildRings();
    window.addEventListener('resize', buildRings);

    function ringPath(cx,cy,baseR,ring,t){
      const points = 56, distortAmt = 0.45;
      ctx.beginPath();
      for (let i=0;i<=points;i++){
        const ang = (i/points)*Math.PI*2 + ring.rot;
        const wobble = 1 + distortAmt*0.18*Math.sin(ang*ring.h1 + t*0.6 + ring.seedPhase) + distortAmt*0.1*Math.sin(ang*ring.h2 - t*0.4 + ring.seedPhase*1.6);
        const rr = baseR*wobble;
        const px = cx+Math.cos(ang)*rr, py = cy+Math.sin(ang)*rr;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
    }

    let t = 0;
    function frame(){
      if (visible){
        const w=dim.w, h=dim.h, cx=w/2, cy=h/2;
        const speed = 3.0*(w/900)*0.6;
        const focal = Math.min(w,h)*0.55;
        const m = md();
        const baseR0 = Math.min(w,h)*0.06;
        ctx.fillStyle = 'rgba(10,9,8,0.25)';
        ctx.fillRect(0,0,w,h);
        for (const r of rings){
          r.z -= speed;
          r.rot += r.rotSpeed;
          if (r.z<=1 || r.z>m*1.35){ resetRing(r); continue; }
          const k = focal/r.z;
          const displayR = baseR0*k;
          if (displayR > Math.max(w,h)*1.4) continue;
          const proximity = 1 - Math.min(r.z/m,1);
          const alpha = Math.min(1, 0.12+proximity*0.9);
          const width = Math.max(0.8, proximity*4.5);
          ctx.save();
          ctx.strokeStyle = r.colorFn+alpha+')';
          ctx.lineWidth = width;
          ctx.shadowColor = r.colorFn+Math.min(1,alpha+0.2)+')';
          ctx.shadowBlur = 6+proximity*22;
          ringPath(cx,cy,displayR,r,t);
          ctx.stroke();
          ctx.restore();
        }
        t += 0.015;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= PLASMA (portada de hyperspace_flow.html) =================
  function runPlasma(){
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');
    const TARGET_W = 220;
    let img;
    function resizeOff(){
      const scale = dim.w/TARGET_W;
      off.width = TARGET_W;
      off.height = Math.max(2, Math.round(dim.h/scale));
      img = octx.createImageData(off.width, off.height);
    }
    resizeOff();
    window.addEventListener('resize', resizeOff);

    function hslToRgb(h,s,l){
      h=((h%360)+360)%360; s/=100; l/=100;
      const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
      let r=0,g=0,b=0;
      if (h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
      return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
    }

    let t = 0;
    function frame(){
      if (visible){
        const pw = off.width, ph = off.height;
        const data = img.data;
        const freq1=0.04, freq2=0.05, freq3=0.03, freq4=0.06;
        let idx=0;
        for (let y=0;y<ph;y++){
          for (let x=0;x<pw;x++){
            const v = Math.sin(x*freq1+t) + Math.sin(y*freq2-t*0.8) + Math.sin((x+y)*freq3+t*1.3) + Math.sin(Math.sqrt((x-pw/2)**2+(y-ph/2)**2)*freq4-t*2);
            const norm=(v+4)/8;
            const hue = 355 + (norm-0.5)*40, sat = 82, light = 10+norm*42;
            const [r,g,b] = hslToRgb(hue,sat,light);
            data[idx++]=r; data[idx++]=g; data[idx++]=b; data[idx++]=255;
          }
        }
        octx.putImageData(img,0,0);
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(off, 0, 0, dim.w, dim.h);
        ctx.restore();
        t += 0.015;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= MANDALA (portada de hyperspace_flow.html) =================
  function runMandala(){
    function hslToRgb(h,s,l){
      h=((h%360)+360)%360; s/=100; l/=100;
      const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
      let r=0,g=0,b=0;
      if (h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
      return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
    }
    function mandalaColor(i,total,t){
      const hue = 355 + Math.sin(t*0.3+i)*20;
      const sat = 82;
      const light = 50+Math.sin(t*0.7+i)*18;
      const [r,g,b] = hslToRgb(hue,sat,light);
      return `rgba(${r},${g},${b},`;
    }
    let t = 0;
    function frame(){
      if (visible){
        const w=dim.w,h=dim.h,cx=w/2,cy=h/2;
        ctx.fillStyle = 'rgba(10,9,8,0.15)';
        ctx.fillRect(0,0,w,h);
        const segs = 8;
        const maxR = Math.min(w,h)*0.48;
        const rotBase = t*0.15;
        ctx.save();
        ctx.translate(cx,cy);
        for (let i=0;i<segs;i++){
          ctx.save();
          ctx.rotate(rotBase + (i/segs)*Math.PI*2);
          if (i%2===1) ctx.scale(1,-1);
          const pulses=3;
          ctx.beginPath();
          ctx.moveTo(0,0);
          for (let p=0;p<=24;p++){
            const f=p/24, rad=f*maxR;
            const width = Math.sin(f*Math.PI)*maxR*0.22*(1+0.4*Math.sin(t*1.4+i+f*pulses*Math.PI));
            const ang=f*0.9;
            ctx.lineTo(Math.sin(ang)*width+rad*0.02, rad);
          }
          for (let p=24;p>=0;p--){
            const f=p/24, rad=f*maxR;
            const width = Math.sin(f*Math.PI)*maxR*0.22*(1+0.4*Math.sin(t*1.4+i+f*pulses*Math.PI));
            const ang=f*0.9;
            ctx.lineTo(-Math.sin(ang)*width+rad*0.02, rad);
          }
          ctx.closePath();
          const color = mandalaColor(i,segs,t);
          const grad = ctx.createLinearGradient(0,0,0,maxR);
          grad.addColorStop(0,color+'0)');
          grad.addColorStop(0.5,color+'0.55)');
          grad.addColorStop(1,color+'0)');
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
        t += 0.015;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  // ================= RORSCHACH (portada de rorschach_flow.html) =================
  function runRorschach(){
    const PALETTE = ['#b31217', '#8f0e14', '#a3121a', '#c81a1a', '#961014'];
    function pickShape(){ return Math.random()<0.5 ? 'circle' : 'diamond'; }
    let blobs = [];
    function buildBlobs(){
      blobs = [];
      for (let i=0;i<42;i++){
        const small = Math.random()<0.55;
        blobs.push({
          fx: 0.15+Math.random()*0.3, fy: 0.12+Math.random()*0.35,
          px: Math.random()*Math.PI*2, py: Math.random()*Math.PI*2,
          baseX: 0.22+Math.random()*0.32, baseY: 0.15+Math.random()*0.7,
          ampX: 0.05+Math.random()*0.1, ampY: 0.08+Math.random()*0.18,
          r: small ? (10+Math.random()*22) : (40+Math.random()*80),
          rPhase: Math.random()*Math.PI*2, rFreq: 0.05+Math.random()*0.12,
          rot: Math.random()*Math.PI, rotSpeed: (Math.random()-0.5)*0.01,
          shape: pickShape(), color: PALETTE[Math.floor(Math.random()*PALETTE.length)]
        });
      }
    }
    buildBlobs();
    window.addEventListener('resize', buildBlobs);

    // filtro CSS no canvas inteiro, igual ao rorschach_flow.html original
    canvas.style.filter = 'blur(13px) contrast(30) brightness(95%) drop-shadow(0 0 18px rgba(193,74,60,0.85)) drop-shadow(4px 6px 5px rgba(0,0,0,0.8))';

    function shapePath(r, shape){
      if (shape === 'diamond'){
        ctx.moveTo(0,-r); ctx.lineTo(r*0.75,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.75,0); ctx.closePath();
      } else {
        ctx.arc(0,0,r,0,Math.PI*2);
      }
    }
    function drawShape(cx,cy,r,shape,rot,color){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rot);
      ctx.beginPath();
      shapePath(r, shape);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    let t = 0;
    function frame(){
      if (visible){
        const w=dim.w, h=dim.h, midX=w/2;
        ctx.fillStyle = '#0a0908';
        ctx.fillRect(0,0,w,h);
        for (const b of blobs){
          const baseX = midX*(b.baseX+b.ampX*Math.sin(t*b.fx+b.px));
          const baseY = h*(b.baseY+b.ampY*Math.cos(t*b.fy+b.py));
          const r = b.r + 20*Math.sin(t*b.rFreq+b.rPhase);
          b.rot += b.rotSpeed;
          const distFromCenter = midX - baseX;
          const leftX = midX - distFromCenter;
          const rightX = midX + distFromCenter;
          drawShape(leftX, baseY, Math.max(r,5), b.shape, b.rot, b.color);
          drawShape(rightX, baseY, Math.max(r,5), b.shape, -b.rot, b.color);
        }
        t += 0.012;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  const RUNNERS = {
    vortice: runVortice,
    cimatica: runCimatica,
    fumaca: runFumaca,
    geometria: runGeometria,
    constelacao: runConstelacao,
    olho: runOlho,
    batimento: runBatimento,
    rorschach: runRorschach,
    stars: runStars,
    wormhole: runWormhole,
    plasma: runPlasma,
    mandala: runMandala
  };

  (RUNNERS[layer] || runVortice)();
})();
</script>
